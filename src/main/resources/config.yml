# CheckAnyDesk — настройки сообщений. Цвета задаются через &.
# {player} — ник игрока, {time} — оставшееся время, {duration} — добавленное время,
# {moderator} — ник модератора, {message} — сообщение игрока.
# В `auto-ban-keywords` можно добавить свои кодовые слова для автобана.

check-duration-minutes: 5

# Точка комнаты проверки. Установите её в игре командой /proverka set.
# Пока точка не задана, игрок остаётся на текущем месте при начале проверки.
check-location: {}

# Эти слова банят проверяемого автоматически на 30 дней. Регистр, пробелы,
# дефисы, повторные буквы, русская/английская раскладка и цифры-замены не важны.
auto-ban-keywords:
  - 'броя'
  - 'broya'
  - 'broia'
  - 'шипучко'
  - 'шипучка'
  - 'shipuchko'
  - 'shipuchka'
  - 'shipychko'
  - 'shipychka'
  - 'флюгер'
  - 'flyuger'
  - 'fliuger'
  - 'fluger'
  - 'weather vane'
  - 'wind vane'
  - 'weathervane'
  - 'windvane'

# Сообщение, которое игрок получает сразу после вызова и затем раз в 10 секунд.
# Замените этот блок на точный текст с вашего макета, если он отличается.
messages:
  checked-chat:
    - '&4| &6Выход из игры, игнор проверки - приведёт к &cБану'
    - '&4| &6Напишите у меня чит - &eесли используете читы'
    - '&4| &7(за признание в читах — уменьшение срока бана.)'
    - ''
    - '&4| &6Проверка выполняется через &cAnyDesk'
    - '&4| &6Ссылка на скачивание: &9&nhttps://anydesk.com/ru'
    - '&4| &6После установки отправьте цифры Вашего рабочего'
    - '&4| &cместа'


  no-permission: '&cУ вас нет прав на использование этой команды.'
  no-report-start-permission: '&cУ вас нет права начать проверку из жалобы: &fcheck.report&c.'
  check-location-usage: '&eИспользование: &f/proverka set'
  check-location-set: '&aТочка комнаты проверки установлена: &f{world} &7({x}, {y}, {z})'
  only-player: '&cЭту команду можно использовать только из игры.'
  player-not-found: '&cИгрок &f{player} &cне найден или не в сети.'
  cannot-check-self: '&cНельзя вызвать на проверку самого себя.'
  target-already-checked: '&cИгрок &f{player} &cуже находится на проверке.'
  moderator-already-checking: '&cСначала завершите свою текущую проверку игрока &f{player}&c.'
  no-active-check: '&cУ вас нет активной проверки.'
  invalid-duration: '&cУкажите время, например: &f/check add 5m'
  time-added: '&aК проверке игрока &f{player} &aдобавлено &f{duration}&a.'
  time-removed: '&eУ проверки игрока &f{player} &eотнято &f{duration}&e.'
  check-started: '&aИгрок &f{player} &aвызван на проверку на &f{time}&a.'
  check-stopped-admin: '&aПроверка игрока &f{player} &aзавершена: проверка пройдена.'
  check-banned-admin: '&cИгрок &f{player} &cзабанен на 30 дней по причине: Читы.'
  movement-flag: '&8[&cПроверка&8] &f{player} &cпопытался двигаться во время проверки.'
  auto-ban-confession: '&8[&cПроверка&8] &f{player} &cавтоматически забанен за признание/кодовое слово.'
  interaction-blocked: '&cВо время проверки нельзя взаимодействовать с предметами и блоками.'
  command-blocked: '&cВо время проверки команды недоступны. Напишите AnyDesk обычным сообщением в чат.'

  target-title: '&cПроверка на читы через AnyDesk'
  target-title-subtitle: '&fСледуйте указаниям модератора'
  bossbar-title: '&cПроверка: &f{player} &8| &fОсталось: &c{time}'
  target-message-sent: '&7Ваше сообщение отправлено модератору проверки.'
  relay-prefix: '&8[&cПроверка&8] &f{player}&7: '

  passed-chat: '&a&lВы прошли проверку!'
  passed-title: '&aВы прошли проверку!'
  passed-title-subtitle: '&fСпасибо за сотрудничество.'
  reward-name: '&b{player}'
  reward-lore:
    - '&aПроверка на читы пройдена'
    - '&7Дата: &f{date}'
    - '&7Время: &f{time}'

  ban-cheats-reason: 'Читы'
  ban-refusal-reason: 'Отказ от Проверки'
  kick-cheats: "&cВы забанены на 30 дней.\n&fПричина: &cЧиты"
  kick-refusal: "&cВы забанены на 7 дней.\n&fПричина: &cОтказ от Проверки"
